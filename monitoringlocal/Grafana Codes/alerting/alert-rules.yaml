apiVersion: 1
groups:
    - orgId: 1
      name: platform-alerts
      folder: FastAPI Alert
      interval: 1m
      rules:
        - uid: eg0d17k4avmyof
          title: platform-slack-alerts
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: up{job="python-app"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: FastAPI has been unreachable by Prometheus for at least 1 minute.
            summary: Fast API is down
          isPaused: false
          notification_settings:
            receiver: platform-slack-alerts
            group_interval: 1m
            repeat_interval: 2m
