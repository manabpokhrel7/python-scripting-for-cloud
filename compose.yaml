services:
  web:
    build: ./my-app
    ports:
      - "5173:80"

  python:
    build: ./GCP
    platform: linux/amd64
    environment:
      - DB_HOST=database
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - redis
      - database

  database:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=manab
      - POSTGRES_PASSWORD=strongpass
      - POSTGRES_DB=mydb

  ollama:
    image: ollama/ollama
    entrypoint: [ "/bin/sh", "-c" ]
    depends_on:
      - redis
    command: >
      "ollama serve & 
       until ollama list >/dev/null 2>&1; do sleep 2; done;
       ollama pull llama3.1 &&
       ollama pull qwen3-embedding:0.6b;
       wait"

  redis:
    image: redis:alpine

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoringlocal/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - python

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoringlocal/grafana/config/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./monitoringlocal/grafana/dashboardconfig/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./monitoringlocal/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoringlocal/grafana/alerting:/etc/grafana/provisioning/alerting
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    depends_on:
      - prometheus

  cadvisor:
    image: ghcr.io/google/cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true


  loki:
    image: grafana/loki:3.7.8
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoringlocal/Loki/config/loki-config.yaml:/etc/loki/config.yaml
      - ./monitoringlocal/Loki/logs:/loki
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3100/ready" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  grafanaalloy:
    image: grafana/alloy:v1.20.1
    volumes:
      - ./monitoringlocal/grafanaalloy/config/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345




